name: EduLead CRM Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edulead_crm
          POSTGRES_USER: edulead
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edulead -d edulead_crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test and package
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/edulead_crm
          SPRING_DATASOURCE_USERNAME: edulead
          SPRING_DATASOURCE_PASSWORD: ci_test_password
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/itsmidris/edulead-crm:latest

      - name: Copy Compose file to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/edulead/

      - name: Deploy on Oracle server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: GHCR_READ_TOKEN,GHCR_USER
          script: |
            set -eu
            test -f /opt/edulead/.env
            echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/edulead
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f